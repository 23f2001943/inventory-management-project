<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Inventory Management{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/bootstrap/css/bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='styles/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container mt-3">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="page-wrapper {% block page_class %}{% endblock %}">
    {% block boxed_content %}
    <div class="content-box">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    {% block free_content %}{% endblock %}
</div>

</body>
</html>
